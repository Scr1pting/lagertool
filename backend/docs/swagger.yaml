host: localhost:8000
info:
  contact:
    email: support@lagertool.com
    name: API Support
  description: |-
    Backend API for inventory management system tracking items, locations, and loans.

    Authentication: log in via GET /auth/eduid/login (VSETH Keycloak) in the browser. The backend then sets an HttpOnly "user_session" cookie, which must be sent with every request (fetch: credentials "include", axios: withCredentials). Without a valid session, all routes except /auth/* and /search return 401.

    Authorisation: /me/... routes act on the logged-in user. Routes marked "Admin only" return 403 for users without admin rights (from the Keycloak roles in AUTH_ADMIN_ROLES).

    With USING_AUTH=false (local dev only) every request acts as the dev user (DEV_USER_ID) with admin rights.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
  termsOfService: http://swagger.io/terms/
  title: Lagertool Inventory API
  version: "1.0"
paths:
  /auth/eduid/callback:
    get:
      description: Called by Keycloak, not by clients. On success sets the user_session
        cookie and redirects to the frontend (FRONTEND_URL).
      parameters:
      - description: Authorization code from Keycloak
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state, must match the oauth_flow cookie
        in: query
        name: state
        required: true
        type: string
      responses:
        "302":
          description: Redirect to the frontend, user_session cookie set
        "400":
          description: Missing/invalid flow cookie, state or code
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: ID token or nonce invalid
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login callback
      tags:
      - auth
  /auth/eduid/login:
    get:
      description: 'Browser navigation, not an XHR call: redirects to the Keycloak
        login page. After login Keycloak redirects back to /auth/eduid/callback.'
      responses:
        "307":
          description: Redirect to Keycloak
      summary: Log in
      tags:
      - auth
  /auth/eduid/logout:
    get:
      description: 'Browser navigation: deletes the session and its cookie, then redirects
        to Keycloak''s logout, which redirects back to OIDC_POST_LOGOUT_REDIRECT.'
      responses:
        "307":
          description: Redirect to Keycloak logout
      summary: Log out
      tags:
      - auth
  /borrow_requests:
    get:
      description: List borrow requests. Without query params returns all (admin only);
        with ?userId=N returns only that user's (that user or admin).
      parameters:
      - description: Filter to requests owned by this user
        in: query
        name: userId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api_objects.BorrowRequest'
            type: array
        "403":
          description: Not allowed for this scope
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List borrow requests
      tags:
      - requests
  /loans/{id}:
    put:
      consumes:
      - application/json
      description: Mark a loan as returned Admin only.
      parameters:
      - description: Loan ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update details
        in: body
        name: loan
        required: true
        schema:
          $ref: '#/definitions/api_objects.UpdateLoan'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
        "403":
          description: Admin rights required
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a loan
      tags:
      - loans
  /me:
    get:
      description: Returns the user of the current session. 401 if not logged in.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_objects.Me'
        "401":
          description: Not logged in
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get the logged-in user
      tags:
      - auth
  /me/borrow_requests:
    get:
      description: Borrow requests of the logged-in user, newest first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api_objects.BorrowRequest'
            type: array
        "401":
          description: Not logged in
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List my borrow requests
      tags:
      - requests
  /me/cart:
    get:
      description: Items in the logged-in user's cart, grouped by organisation name,
        with availability for the date range. An empty cart returns {}.
      parameters:
      - description: Start date in format 2006-01-02
        in: query
        name: start
        required: true
        type: string
      - description: End date in format 2006-01-02
        in: query
        name: end
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/api_objects.CartItem'
              type: array
            type: object
        "401":
          description: Not logged in
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get my shopping cart
      tags:
      - cart
  /me/cart/checkout:
    post:
      consumes:
      - application/json
      description: Turns the logged-in user's cart into borrow requests (one per organisation,
        state "requested") for the given dates, then empties the cart.
      parameters:
      - description: Borrow period
        in: body
        name: checkout
        required: true
        schema:
          $ref: '#/definitions/api_objects.CheckoutRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid body or empty cart
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Not logged in
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check out my shopping cart
      tags:
      - cart
  /me/cart/items:
    delete:
      description: Deletes all items from the logged-in user's cart and returns the
        deleted items.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db_models.ShoppingCartItem'
            type: array
        "401":
          description: Not logged in
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Empty my shopping cart
      tags:
      - cart
    post:
      consumes:
      - application/json
      description: Adds an inventory item to the logged-in user's cart. The cart is
        created on first use.
      parameters:
      - description: Inventory item id and amount
        in: body
        name: cart_item
        required: true
        schema:
          $ref: '#/definitions/api_objects.CartRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/db_models.ShoppingCartItem'
        "401":
          description: Not logged in
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add an item to my shopping cart
      tags:
      - cart
  /me/cart/items/{itemId}:
    delete:
      description: Deletes an item from the logged-in user's cart by inventory item
        ID.
      parameters:
      - description: Inventory Item ID
        in: path
        name: itemId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Not logged in
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove an item from my shopping cart
      tags:
      - cart
    put:
      consumes:
      - application/json
      description: Updates the amount of an item in the logged-in user's cart.
      parameters:
      - description: Inventory Item ID
        in: path
        name: itemId
        required: true
        type: integer
      - description: New amount
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/api_objects.UpdateCartItem'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Not logged in
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Change an amount in my shopping cart
      tags:
      - cart
  /me/checkout:
    post:
      consumes:
      - application/json
      description: Creates a borrow request for one item without going through (or
        touching) the cart. The description, if any, becomes the first message on
        the request.
      parameters:
      - description: Item, amount, dates, title and description
        in: body
        name: checkout
        required: true
        schema:
          $ref: '#/definitions/api_objects.InstantCheckoutRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/db_models.Request'
        "400":
          description: Invalid body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Not logged in
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Item not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Borrow a single item directly
      tags:
      - cart
  /organisations:
    get:
      description: Get all organisations
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db_models.Organisation'
            type: array
      summary: Get all organisations
      tags:
      - organisations
  /organisations/{orgId}/buildings:
    get:
      description: Get all buildings sorted by update date
      parameters:
      - description: Organisation name
        in: path
        name: orgId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api_objects.Building'
            type: array
      summary: Get all buildings for an organisation
      tags:
      - buildings
    post:
      consumes:
      - application/json
      description: Create a new building for an organisation Admin only.
      parameters:
      - description: Organisation name
        in: path
        name: orgId
        required: true
        type: string
      - description: Building object
        in: body
        name: building
        required: true
        schema:
          $ref: '#/definitions/api_objects.BuildingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/db_models.Building'
        "403":
          description: Admin rights required
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new building
      tags:
      - buildings
  /organisations/{orgId}/buildings/{buildingId}/rooms:
    post:
      consumes:
      - application/json
      description: Create a new room in a building Admin only.
      parameters:
      - description: Organisation name
        in: path
        name: orgId
        required: true
        type: string
      - description: Building ID
        in: path
        name: buildingId
        required: true
        type: integer
      - description: Room object
        in: body
        name: room
        required: true
        schema:
          $ref: '#/definitions/api_objects.RoomRequest'
